<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#104631">
  <meta name="description" content="مواضع النبات في المملكة العربية السعودية والمصادر التي ذكرتها، بحسب معرّف النبات الأصلي.">
  <title>خريطة النبات ومصادره</title>
  <link rel="icon" href="./favicon.svg">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a class="skip" href="#plant-map">انتقل إلى الخريطة</a>
  <main class="preview-shell">
    <div class="preview-toolbar" aria-label="أدوات معاينة الخريطة">
      <span class="preview-label"><img src="./favicon.svg" alt="" width="32" height="32">معاينة الخريطة</span>
      <div class="preview-actions"><button id="choose" type="button">اختيار نبات</button><a href="./manage.html">تحديث البيانات</a></div>
    </div>
    <saudi-flora-map id="plant-map" local-preview></saudi-flora-map>
    <p id="examples" class="examples">جرّب الخريطة:
      <button type="button" data-uuid="f009a176-94e3-4387-b682-0f416bf31afd">الأراكة</button>
      <button type="button" data-uuid="c1c50e15-45ff-42ba-8973-3d4a74aa0724">العرعر</button>
      <button type="button" data-uuid="bcd2ef39-7f1c-457d-8aa2-ce422c96f17d">مانجروف أبيض</button>
    </p>
    <noscript><p>فعّل JavaScript لعرض خريطة النبات ومصادرها.</p></noscript>
  </main>
  <dialog id="picker" role="dialog" aria-labelledby="picker-title" aria-modal="true" data-uds-component="modal">
    <div class="dialog-head"><h1 id="picker-title">اختيار النبات للمعاينة</h1><button id="close-picker" type="button">إغلاق</button></div>
    <form id="search" role="search" aria-label="البحث في النباتات" data-uds-component="search-box">
      <label for="query">اسم النبات العربي أو العلمي، أو UUID</label>
      <div class="search-row"><input id="query" type="search" autocomplete="off" aria-describedby="search-help search-count"><button type="submit">بحث</button></div>
      <p id="search-help">اختر المدخل الصحيح باستخدام اسمه العلمي؛ تشابه الأسماء لا يربط مناطق نبات بآخر.</p>
    </form>
    <p id="search-count" role="status"></p>
    <ul id="matches" data-uds-component="list"></ul>
  </dialog>
</body>
</html>
